name: Security Scan
on:
  push:
    branches: [main]
  pull_request:

jobs:
  security:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Run MCP Sentinel Security Scan
        uses: beejak/mcp-sentinel-action@v2
        with:
          enable-semgrep: true       # Enable Semgrep rules
          fail-on: high              # Fail workflow on high-severity issues
          output-format: sarif       # Output format compatible with GitHub code scanning
